name: Build & Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. v2.2.0)"
        required: true
        default: "2.2.0"
      release_name:
        description: "Release title (e.g. Zapret-Zen 2.2.0)"
        required: false
        default: ""
      prerelease:
        description: "Mark as prerelease"
        type: boolean
        required: false
        default: false
      body:
        description: "Release notes (Markdown). If empty, reads from release_note.md"
        required: false
        default: ""

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Clean workspace
        shell: pwsh
        run: |
          Remove-Item .\dist_nuitka -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item .\.nuitka_staging -Recurse -Force -ErrorAction SilentlyContinue

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        env:
          PIP_PREFER_BINARY: "1"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Nuitka x64
        shell: pwsh
        run: |
          $version = "${{ inputs.tag }}".TrimStart("v")
          .\scripts\build_nuitka.ps1 -Python python -OutputDir dist_nuitka -Compiler msvc -Version $version

      - name: Upload x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuitka-win-x64
          path: dist_nuitka/main.dist/**
          if-no-files-found: error

  build-windows-arm64:
    runs-on: windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Clean workspace
        shell: pwsh
        run: |
          Remove-Item .\dist_nuitka -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item .\.nuitka_staging -Recurse -Force -ErrorAction SilentlyContinue

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Rust fallback
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: pwsh
        env:
          PIP_PREFER_BINARY: "1"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Build Nuitka arm64
        shell: pwsh
        run: |
          $version = "${{ inputs.tag }}".TrimStart("v")
          .\scripts\build_nuitka.ps1 -Python python -OutputDir dist_nuitka -Compiler msvc -Version $version

      - name: Upload arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuitka-win-arm64
          path: dist_nuitka/main.dist/**
          if-no-files-found: error

  package-and-release:
    needs:
      - build-windows-x64
      - build-windows-arm64
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Clean workspace
        shell: pwsh
        run: |
          Remove-Item .\dist_nuitka -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item .\dist_installer -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item .\.nuitka_staging -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item .\.artifacts -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item .\installer_payload -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item .\release_* -Recurse -Force -ErrorAction SilentlyContinue

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        env:
          PIP_PREFER_BINARY: "1"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Download x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: nuitka-win-x64
          path: .artifacts/win_x64

      - name: Download arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: nuitka-win-arm64
          path: .artifacts/win_arm64

      - name: Resolve version
        id: meta
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"
          if (-not $tag) { $tag = "v0.0.0" }
          $version = $tag.TrimStart("v")
          $name = "${{ inputs.release_name }}"
          if (-not $name) { $name = "Zapret-Zen $version" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT

      - name: Inject version into pyproject.toml
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $content = Get-Content pyproject.toml -Raw -Encoding UTF8
          $content = $content -replace 'version = ".*"', "version = `"$version`""
          Set-Content pyproject.toml $content -Encoding UTF8 -NoNewline
          Write-Host "Set version to $version in pyproject.toml"

      - name: Prepare release payloads
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          python .\scripts\prepare_nuitka_release.py `
            --x64-source .\.artifacts\win_x64 `
            --arm64-source .\.artifacts\win_arm64 `
            --payload-dir .\installer_payload `
            --release-dir ".\release_$version" `
            --version $version

      - name: Build universal installer
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          .\scripts\build_nuitka_installer.ps1 -Python python -PayloadDir installer_payload -OutputDir dist_installer -SkipPrepareRelease -Version $version

      - name: Place installer into release folder
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $installer = Get-ChildItem ".\dist_installer\install_zapretzen_*.exe" | Select-Object -First 1
          if ($installer) {
            Copy-Item $installer.FullName ".\release_$version\" -Force
          }

      - name: Read release notes
        id: notes
        shell: pwsh
        run: |
          $body = ""
          $inputBody = "${{ inputs.body }}"
          if ($inputBody.Trim()) {
            $body = $inputBody
          } elseif (Test-Path "release_note.md") {
            $body = Get-Content "release_note.md" -Raw -Encoding UTF8
          }
          if (-not $body.Trim()) {
            $body = "Zapret-Zen ${{ steps.meta.outputs.version }} release."
          }
          $delimiter = "REL_BODY_EOF_{0}" -f [guid]::NewGuid().ToString("N")
          "body<<$delimiter" >> $env:GITHUB_OUTPUT
          $body >> $env:GITHUB_OUTPUT
          $delimiter >> $env:GITHUB_OUTPUT

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            release_${{ steps.meta.outputs.version }}/*.exe
            release_${{ steps.meta.outputs.version }}/*portable*.zip
          draft: false
          prerelease: ${{ inputs.prerelease }}
